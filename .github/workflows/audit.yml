name: audit

# Known vulnerabilities in the locked dependencies of all environments, with pixi audit
# (https://prefix.dev/blog/pixi-audit-beta). It fails for a vulnerability with a fixed release; the rules for
# fixed releases we can't reach yet are in [tool.pixi-audit] of pixi.toml. The weekly run reports new
# vulnerabilities and expired rules also when nothing changed here.

on:
  push:
    branches:
    - develop
    - stable
  pull_request:
    branches:
    - develop
    - stable
    - 'GSOC**'
    paths:
    - pixi.toml
    - pixi.lock
    - .github/workflows/audit.yml
  schedule:
  - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixi-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        pixi-version: latest
        # the audit reads pixi.lock, no environment is installed
        run-install: false
    - name: Install pixi audit
      run: pixi global install --channel https://prefix.dev/prefix-dev/prefix-labs "pixi-audit==0.2.2"
    - name: Audit pixi.lock
      env:
        # API token of prefix.dev (Basilisk); a repository secret, pull requests from forks don't get it
        PIXI_AUDIT_TOKEN: ${{ secrets.PIXI_AUDIT_TOKEN }}
      run: |
        if [ -z "$PIXI_AUDIT_TOKEN" ]; then
          echo "::notice::PIXI_AUDIT_TOKEN is not available, the audit is skipped"
          exit 0
        fi
        pixi audit
