name: Build Gallery

on:
  pull_request:

jobs:
  Test-MSS-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        pixi-version: latest
        cache: true
        environments: dev
    - name: Create gallery
      timeout-minutes: 5
      run: |
        cd docs
        pixi run -e dev python conf.py
