name: Test MSS

on:
  push:
    branches:
      - develop
      - stable
      - 'GSOC**'
  pull_request:
    branches:
      - develop
      - stable
      - 'GSOC**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-14", "macos-15", "ubuntu-latest"]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
    - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
      with:
        pixi-version: latest
        cache: true
        environments: dev
    - name: Check CI resource limits
      run: |
        echo "=== Resource Limits ==="
        if [ "$(uname)" = "Linux" ]; then
          echo "Open files: $(ulimit -n)"
          echo "Max processes: $(ulimit -u)"
          echo "Port range: $(sysctl -n net.ipv4.ip_local_port_range 2>/dev/null || echo 'N/A')"
        elif [ "$(uname)" = "Darwin" ]; then
          echo "Open files: $(ulimit -n)"
          echo "Max processes: $(ulimit -u)"
          launchctl limit maxfiles | head -1
        else
          echo "Windows: Checking handles..."
          Get-Process -Id $PID | Select-Object -ExpandProperty HandleCount
        fi
    - name: Run tests
      timeout-minutes: 40
      run: |
        mkdir -p /tmp/mpl_cache
        # Set stricter resource limits for tests
        if [ "$(uname)" = "Linux" ]; then
          ulimit -n 16384 2>/dev/null || true
        fi
        pixi run -e dev env QT_QPA_PLATFORM=offscreen MPLCONFIGDIR=/tmp/mpl_cache pytest -v -n logical --durations=20 --cov=mslib tests
    - run: pixi run -e dev coverage xml
    - name: Send coverage to Coveralls (parallel)
      uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
      with:
        fail-on-error: false
        debug: true
        parallel: true
        format: cobertura
        flag-name: ${{ join(matrix.*, ' - ') }}

  finish:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
        with:
          fail-on-error: false
          parallel-finished: true
