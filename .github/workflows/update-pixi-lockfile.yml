name: Update pixi lockfile

on:
  schedule:
  # At 04:00 on Monday
    - cron: "0 4 * * 1"
  # ...or manually
  workflow_dispatch:

jobs:
  pixi-update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base_branch: ["develop", "stable"]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v4
        with:
          ref: ${{ matrix.base_branch }}
      - name: Generate new lockfile
        uses: prefix-dev/setup-pixi@fef5c9568ca6c4ff7707bf840ab0692ba3f08293 # v0.9.0
        with:
          pixi-version: latest
          run-install: false
      - name: Update pixi lockfile
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7
        with:
          token: ${{ secrets.PAT }}
          branch: automation/update-pixi-lockfile/${{ matrix.base_branch }}
          delete-branch: true
          add-paths: pixi.lock
          commit-message: Update pixi lockfile
          title: Update pixi lockfile
          body-path: diff.md
