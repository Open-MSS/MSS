name: rtd
channels:
  - conda-forge
dependencies:
  - python
  - setuptools <81
  - pip
  - pip:
      - flask
      - flask-httpauth
      - chameleon
      - multidict
      - isodate
      - scipy
      - metpy
      - markdown
      - xstatic>=1.0.3
      - xstatic-jquery<3.6
      - xstatic-bootstrap<4.6
      - defusedxml
      - sphinx_rtd_theme
      - sphinxcontrib-video>=0.2.1
      - sphinx
      - netCDF4
      - PyQt5
      - owslib
      - ../

  - basemap >=1.3.3
  - pint
