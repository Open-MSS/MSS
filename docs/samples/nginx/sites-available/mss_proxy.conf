# TLS proxy in front of mscolab, started by gunicorn on 127.0.0.1:8087,
# see the mscolab documentation
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  # keep it at MAX_CONTENT_LENGTH of mscolab_settings.py
  client_max_body_size 16M;

  ssl_certificate     /etc/ssl/certs/chain.pem;
  ssl_certificate_key /etc/ssl/private/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 5m;

  server_name your.server;

  # the mscolab command line tool notifies the server directly by SERVER_URL,
  # e.g. http://127.0.0.1:8087, keep this endpoint off the network
  location = /internal_notify {
    return 404;
  }

  location / {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    # websockets of socket.io
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_pass http://127.0.0.1:8087;
  }
}
