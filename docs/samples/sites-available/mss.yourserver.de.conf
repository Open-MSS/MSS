# Use https, e.g. by certbot, the login of basic authentication is sent
# with every request.
<VirtualHost *:80>
    ServerName mss.yourserver.de
    #ServerAlias localwms
    LogLevel warn
    ServerAdmin webmaster@yourserver.de
    ErrorLog /home/mss/INSTANCE/log/mss_error.log
    TransferLog /var/log/apache2/mss_access.log
    CustomLog /var/log/apache2/mss_custom.log combined


    # all wsgi scripts are in /home/mss/INSTANCE/wsgi
    <Directory /home/mss/INSTANCE/wsgi>
        AuthType Basic
        AuthName "mss"
        AuthBasicProvider wsgi
        WSGIAuthUserScript /home/mss/INSTANCE/wsgi/auth.wsgi
        Require valid-user
    </Directory>

    # alternative without authentication by apache, also when mswms itself
    # asks for the login (ENABLE_BASIC_HTTP_AUTHENTICATION in mswms_settings.py),
    # then mod_wsgi has to pass the Authorization header on to mswms
    #<Directory /home/mss/INSTANCE/wsgi>
    #    Require all granted
    #</Directory>
    #WSGIPassAuthorization On

    WSGIScriptAlias / /home/mss/INSTANCE/wsgi/wms.wsgi
    WSGIDaemonProcess MSS python-home=/home/mss/MSS/.pixi/envs/default user=mss group=mss home=/home/mss/INSTANCE/config processes=2 threads=1 deadlock-timeout=25 display-name=MSS
    # WSGI Options
    # python-home: path where your environment python bin is located
    # home: where your config scripts are located
    # Please see the documentation here: https://modwsgi.readthedocs.io/en/master/configuration.html
    WSGIProcessGroup MSS

    # Python Simplified GIL State API
    # https://modwsgi.readthedocs.io/en/master/user-guides/application-issues.html
    WSGIApplicationGroup %{GLOBAL}


    # don't loose time with IP address lookups
    HostnameLookups Off

    # needed for named virtual hosts
    UseCanonicalName Off

    # configures the footer on server-generated documents
    ServerSignature On

</VirtualHost>
