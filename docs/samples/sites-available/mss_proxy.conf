# Front proxy for many MSWMS instances, each one served by its own
# VirtualHost on 127.0.0.1, see proxy_demo.yourserver.de.conf.
# Needs the apache modules proxy and proxy_http (a2enmod proxy proxy_http).
<VirtualHost *:80>
    ServerName proxy_demo.yourserver.de

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /demo http://127.0.0.1/demo
    ProxyPassReverse /demo http://127.0.0.1/demo
</VirtualHost>
