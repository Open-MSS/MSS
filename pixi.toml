[workspace]
name = "MSS"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tasks]

[pypi-dependencies]
open-mss = { path = ".", editable = true }

[dependencies]
basemap = ">=1.3.3"
cftime = ">=1.0.1"
chameleon = "*"
defusedxml = "*"
email_validator = "*"
execnet = "*"
fastkml = ">=1.1.0,<2"
flask = ">=2.3.2"
flask-cors = "*"
flask-httpauth = "*"
flask-login = "*"
flask-mail = "*"
flask-migrate = "*"
flask-socketio = ">=5.1.0"
flask-sqlalchemy = ">=3.0.0"
flask-wtf = "*"
git = "*"
gitpython = "*"
gpxpy = ">=1.4.2"
hdf4 = "*"
isodate = "*"
itsdangerous = "*"
keyring = "*"
libgfortran5 = ">=14"
libtiff = "*"
lxml = "*"
markdown = "*"
matplotlib = ">=3.5.3"
metpy = "*"
multidict = "*"
netcdf4 = "*"
numpy = ">=2.2.4"
owslib = ">=0.24"
argon2-cffi = ">=23.1.0"
pillow = "*"
pint = "*"
psycopg2 = "*"
pycountry = "*"
pyjwt = "*"
pymysql = ">=0.9.3"
pyqt = ">=5.15.0"
pysaml2 = "*"
python = "<3.12"
python-engineio = ">=4"
python-slugify = "*"
python-socketio = ">=5"
qt = ">=5.15.0"
requests = ">=2.31.0"
scipy = "*"
skyfield = ">=1.12"
skyfield-data = ">=7"
tk = "*"
unicodecsv = "*"
websocket-client = "*"
werkzeug = ">=2.2.3, <3.0.0"
xstatic = "<2.0.0"
xstatic-bootstrap = "*"
xstatic-jquery = "*"
humanfriendly = ">=10.0,<11"

[target.linux-64.dependencies]
dbus-python = "*"
libxmlsec1 = "*"

[target.osx-64.dependencies]
dbus-python = "*"
libxmlsec1 = "*"

[target.osx-arm64.dependencies]
dbus-python = "*"
libxmlsec1 = "*"

[feature.addons.dependencies]
geographiclib = "*"
geomag = "*"
geopy = "*"

[feature.dev.dependencies]
codespell = "*"
coveralls = "*"
dnspython = ">=2.0.0, <2.3.0"
flake8 = "*"
flake8-builtins = "*"
gsl = "==2.7.0"
mock = "*"
py = "*"
pynco = "*"
pytest = "*"
pytest-cov = "*"
pytest-qt = "*"
pytest-randomly = "*"
pytest-xdist = "*"

[feature.dev.tasks]
lint = { cmd = "git ls-files -z '**.py' | xargs -0 flake8" }
codespell = { cmd = "git ls-files -z | xargs -0 codespell --check-filenames" }
test-fast = "env QT_QPA_PLATFORM=offscreen pytest -q -n logical tests/_test_plugins tests/_test_utils tests/test_meta.py"
test-plugins = "env QT_QPA_PLATFORM=offscreen pytest -q -n logical tests/_test_plugins"
test-utils = "env QT_QPA_PLATFORM=offscreen pytest -q -n logical tests/_test_utils"
test-msui = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical tests/_test_msui"
test-mscolab = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical tests/_test_mscolab"
test-mswms = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical tests/_test_mswms"
test = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical --durations=20 tests"

[feature.tutorials]
platforms = ["win-64", "linux-64", "osx-64"]

[feature.tutorials.dependencies]
mouseinfo = "*"
opencv = "*"
pyautogui = "*"
pyscreeze = "*"
python-mss = "*"

[feature.tutorials.target.linux-64.dependencies]
# Clipboard CLI so type_localized can paste layout-independently on X11
# (Wayland users additionally need wl-clipboard).
xclip = "*"

[feature.docs]
platforms = ["win-64", "linux-64", "osx-64"]

[feature.docs.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-video = ">=0.2.1"

[environments]
addons = ["addons"]
dev = ["dev", "docs"]
tutorials = ["tutorials"]
docs = ["docs"]
