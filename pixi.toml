[workspace]
name = "MSS"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tasks]

[pypi-dependencies]
open-mss = { path = ".", editable = true }

# The default feature is the repository itself. The dependencies of each package are a feature of their own, as
# the conda recipe splits them: mss-utils, mss-mscolab-api, mss-mswms, mss-mscolab, mss-msidp, mss-msui. The
# environments named after a package (msutils, msapi, mswms, mscolab, msidp, msui) have only that package and what
# it depends on, and run its tests: an import of something the package doesn't depend on fails there.
[dependencies]
python = "<3.12"

[feature.utils.dependencies]
argon2-cffi = ">=23.1.0"
defusedxml = "*"
hdf4 = "*"
isodate = "*"
libgfortran5 = ">=14"
libtiff = ">=4.7.2"
markdown = "*"
metpy = "*"
netcdf4 = "*"
numpy = ">=2.2.4"
pint = "*"
pyproj = "*"
requests = ">=2.33.0"
scipy = "*"

[feature.utils.tasks]
test-utils = "env QT_QPA_PLATFORM=offscreen pytest -q -n logical tests/_test_utils"

# mss-mscolab-api needs nothing but python
[feature.api.tasks]
test-api = "env QT_QPA_PLATFORM=offscreen pytest -q -n logical tests/_test_api"

[feature.mswms.dependencies]
basemap = ">=1.3.3"
chameleon = "*"
flask = ">=3.1.3"
flask-httpauth = ">=4.8.1"
# matplotlib pulls in pyqt
matplotlib-base = ">=3.5.3"
multidict = ">=6.9.1"
owslib = ">=0.24"
pillow = ">=13.0.0"
# 3.1.9 fixes safe_join with Windows device names (GHSA-g6x2-hccm-hh4m)
werkzeug = ">=3.1.9"
xstatic = "<2.0.0"
xstatic-bootstrap = ">=5"
xstatic-jquery = "*"

[feature.mswms.tasks]
test-mswms = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical tests/_test_mswms"

[feature.mscolab.dependencies]
email_validator = "*"
flask = ">=3.1.3"
flask-cors = "*"
flask-httpauth = ">=4.8.1"
flask-mail = "*"
flask-migrate = "*"
flask-socketio = ">=5.1.0"
flask-sqlalchemy = ">=3.0.0"
flask-wtf = "*"
git = "*"
gitpython = ">=3.2.1"
itsdangerous = "*"
pillow = ">=13.0.0"
# PostgreSQL, supported and tested since #3295
psycopg2 = "*"
pyjwt = ">=2.15.0"
pymysql = ">=0.9.3"
pysaml2 = "*"
python-engineio = ">=4.13.2"
python-socketio = ">=5.16.2"
pyyaml = "*"
werkzeug = ">=3.1.9"
xstatic = "<2.0.0"
xstatic-bootstrap = ">=5"
xstatic-jquery = "*"

[feature.mscolab.target.linux-64.dependencies]
libxmlsec1 = "*"

[feature.mscolab.target.osx-64.dependencies]
libxmlsec1 = "*"

[feature.mscolab.target.osx-arm64.dependencies]
libxmlsec1 = "*"

[feature.mscolab.tasks]
test-mscolab = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical tests/_test_mscolab"

[feature.msidp.dependencies]
mako = ">=1.3.12"
pysaml2 = "*"
werkzeug = ">=3.1.9"

[feature.msidp.target.linux-64.dependencies]
libxmlsec1 = "*"

[feature.msidp.target.osx-64.dependencies]
libxmlsec1 = "*"

[feature.msidp.target.osx-arm64.dependencies]
libxmlsec1 = "*"

[feature.msidp.tasks]
test-msidp = "env QT_QPA_PLATFORM=offscreen pytest -q -n logical tests/_test_msidp"

# mss-msui: msui with plugins, support and autoplot
[feature.msui.dependencies]
basemap = ">=1.3.3"
click = "*"
fastkml = ">=1.1.0,<2"
gpxpy = ">=1.4.2"
humanfriendly = ">=10.0,<11"
keyring = "*"
lxml = ">=6.1.0"
# not the matplotlib metapackage: depending on the build it pulls in another Qt binding (pyside6) besides pyqt
matplotlib-base = ">=3.5.3"
owslib = ">=0.24"
packaging = "*"
pillow = ">=13.0.0"
platformdirs = "*"
pycountry = "*"
pyqt = ">=5.15.0"
python-engineio = ">=4.13.2"
python-slugify = "*"
python-socketio = ">=5.16.2"
skyfield = ">=1.12"
skyfield-data = ">=7"
unicodecsv = "*"
websocket-client = "*"

[feature.msui.target.linux-64.dependencies]
dbus-python = "*"

[feature.msui.target.osx-64.dependencies]
dbus-python = "*"

[feature.msui.target.osx-arm64.dependencies]
dbus-python = "*"

[feature.msui.tasks]
# the tests that run against an MSColab or MSWMS server need the dev environment, see tests/_test_msui/conftest.py
test-msui-without-servers = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical -m 'not servers' tests/_test_msui"
test-plugins = "env QT_QPA_PLATFORM=offscreen pytest -q -n logical tests/_test_plugins"

[feature.test.dependencies]
mock = "*"
pytest = ">=9.0.3"
pytest-cov = "*"
pytest-randomly = "*"
pytest-xdist = "*"

[feature.qttest.dependencies]
pytest-qt = "*"

# the mswms tests change their test data with nco (tests/_test_mswms/test_wms.py)
[feature.ncotest.dependencies]
gsl = "==2.7.0"
pynco = "*"

[feature.addons.dependencies]
geographiclib = "*"
geomag = "*"
geopy = ">=2.5.0"

[feature.dev.dependencies]
codespell = "*"
coveralls = "*"
flake8 = "*"
flake8-builtins = "*"
import-linter = ">=2"
py = "*"

[feature.dev.tasks]
lint = { cmd = "git ls-files -z '**.py' | xargs -0 flake8" }
lint-imports = "lint-imports"
codespell = { cmd = "git ls-files -z | xargs -0 codespell --check-filenames" }
test-fast = "env QT_QPA_PLATFORM=offscreen pytest -q -n logical tests/_test_api tests/_test_plugins tests/_test_utils tests/test_meta.py tests/test_samples.py"
test-msui = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical tests/_test_msui"
test = "env QT_QPA_PLATFORM=offscreen pytest -v -n logical --durations=20 tests"


[feature.tutorials]
platforms = ["win-64", "linux-64", "osx-64"]

[feature.tutorials.dependencies]
mouseinfo = "*"
opencv = "*"
pyautogui = "*"
pyscreeze = "*"
python-mss = "*"

[feature.tutorials.target.linux-64.dependencies]
# Clipboard CLI so type_localized can paste layout-independently on X11
# (Wayland users additionally need wl-clipboard).
xclip = "*"

[feature.docs]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-64"]

[feature.docs.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-video = ">=0.2.1"

[environments]
# all packages, for using MSS from this repository: `pixi run msui`
default = ["utils", "api", "mswms", "mscolab", "msidp", "msui"]
# the environment of all developers: every package, all tests incl. the msui tests against the servers, lint, docs
dev = { features = ["utils", "api", "mswms", "mscolab", "msidp", "msui", "test", "qttest", "ncotest", "dev", "docs"] }
# Each package environment is solved on its own, as conda installs that package alone: a server environment
# isn't held back by what msui (Qt5) pins, it gets the latest fixed versions (pixi audit).
msutils = { features = ["utils", "test"] }
msapi = { features = ["api", "test"] }
mswms = { features = ["utils", "mswms", "test", "ncotest"] }
mscolab = { features = ["utils", "api", "mscolab", "test"] }
msidp = { features = ["msidp", "test"] }
msui = { features = ["utils", "api", "msui", "test", "qttest"] }
addons = ["utils", "api", "mswms", "mscolab", "msidp", "msui", "addons"]
tutorials = ["utils", "api", "mswms", "mscolab", "msidp", "msui", "tutorials"]
docs = ["utils", "api", "mswms", "mscolab", "msidp", "msui", "docs"]

[tool.pixi-audit]
# `pixi audit` (CI workflow audit.yml) fails for a known vulnerability with a fixed release: update the lock file or
# raise the lower bound. Vulnerabilities without any fixed release are reported, they don't fail. The rules below
# are for fixed releases we can't reach yet, each for the vulnerabilities known now: a new one fails the audit, and
# each rule expires, then the audit reports them again and they have to be checked.
ignore-unfixed = true
ignore = [
  { id = "CVE-2026-18295", package = "gstreamer", reason = "qt-main 5.15.15, the last Qt5 build of conda-forge (PyQt5), is built against it; fixed only with Qt6", expired-at = "2027-05-31" },
