[aliases]
test = pytest

[coverage:run]
branch = True
relative_files = True
source = mslib
omit =
 mslib/msui/qt5/*py
 tests/*

[tool:pytest]
norecursedirs = .git .idea .cache

[flake8]
ignore = E124,E125,E402,W503,W504,A005
max-line-length = 120
exclude = mslib/msui/qt5/*.py, mslib/mscolab/migrations/*.py

# Architectural import contracts (checked by `pixi run -e dev lint-imports` and CI).
# The target dependency direction is documented in ARCHITECTURE.md. Every entry in
# an ignore_imports list below is a grandfathered, known violation of the target
# architecture -- shrink these lists, never grow them.
[importlinter]
root_package = mslib
include_external_packages = True

[importlinter:contract:gui-isolation]
name = Only the GUI package may import mslib.msui
type = forbidden
source_modules =
    mslib.mscolab
    mslib.mswms
    mslib.utils
    mslib.plugins
    mslib.msidp
    mslib.support
forbidden_modules =
    mslib.msui
ignore_imports =
    mslib.plugins.io.csv -> mslib.msui.flighttrack
    mslib.plugins.io.text -> mslib.msui.flighttrack
    mslib.plugins.io.flitestar -> mslib.msui.flighttrack
    # To do (package split, #2307): the docs blueprints get their own favicon/logo.
    mslib.mswms.blueprints.docs -> mslib.msui.icons
    mslib.mscolab.blueprints.docs -> mslib.msui.icons

[importlinter:contract:server-isolation]
name = Only the shared protocol constants of mslib.mscolab may be imported elsewhere
type = forbidden
source_modules =
    mslib.msui
    mslib.mswms
    mslib.utils
    mslib.plugins
    mslib.msidp
    mslib.support
    mslib.autoplot
forbidden_modules =
    mslib.mscolab
ignore_imports =
    # mslib.mscolab.api is the typed client/server contract (schemas +
    # endpoint registry) plus the shared socket/message vocabulary
    # (events.py, message_type.py): the one part of mslib.mscolab any msui
    # module may import. Reworked from a per-call-site whitelist (2 lines for
    # mslib.msui.mscolab only) into this wildcard once a 3rd file
    # (mscolab_connect_dialog.py) needed it too. The api-leaf contract below
    # keeps this safe.
    mslib.msui.* -> mslib.mscolab.api.*

[importlinter:contract:api-leaf]
name = mslib.mscolab.api (the mss-mscolab-api package) needs nothing but the standard library
type = forbidden
source_modules =
    mslib.mscolab.api
# the rest of mslib.mscolab is listed module by module: a new module of mslib.mscolab
# has to be added here
forbidden_modules =
    mslib.mscolab.app
    mslib.mscolab.auth
    mslib.mscolab.blueprints
    mslib.mscolab.chat_manager
    mslib.mscolab.cli_notify
    mslib.mscolab.conf
    mslib.mscolab.custom_migration_types
    mslib.mscolab.file_manager
    mslib.mscolab.forms
    mslib.mscolab.migrations
    mslib.mscolab.models
    mslib.mscolab.mscolab
    mslib.mscolab.seed
    mslib.mscolab.server
    mslib.mscolab.sockets_manager
    mslib.mscolab.utils
    mslib.msui
    mslib.mswms
    mslib.utils
    mslib.support
    mslib.plugins
    mslib.autoplot
    mslib.msidp
    PyQt5
    numpy
    flask
    flask_cors
    flask_httpauth
    flask_mail
    flask_migrate
    flask_socketio
    flask_sqlalchemy
    flask_wtf
    alembic
    sqlalchemy
    werkzeug
    saml2

[importlinter:contract:wms-isolation]
name = No other mslib package may import the mswms server
type = forbidden
source_modules =
    mslib.msui
    mslib.mscolab
    mslib.utils
    mslib.plugins
    mslib.msidp
    mslib.support
    mslib.autoplot
forbidden_modules =
    mslib.mswms

[importlinter:contract:utils-base-layer]
name = mslib.utils is the base layer: no other mslib package, no Qt, no keyring, no server stack
type = forbidden
source_modules =
    mslib.utils
forbidden_modules =
    mslib.support
    mslib.autoplot
    mslib.plugins
    mslib.msidp
    PyQt5
    keyring
    flask
    flask_cors
    flask_httpauth
    flask_mail
    flask_migrate
    flask_socketio
    flask_sqlalchemy
    flask_wtf
    alembic
    sqlalchemy
    werkzeug
    saml2
# Every line below is a to-do of the package split (#2307) and goes with the change that removes the import;
# import-linter reports a line whose import is gone, so the list can only shrink.
ignore_imports =
    # to do: send_email moves to mslib.mscolab
    mslib.utils.auth -> flask
    mslib.utils.auth -> flask_mail
    # to do: the Qt client modules move to mslib.msui
    mslib.utils.airdata -> PyQt5
    mslib.utils.colordialog -> PyQt5
    mslib.utils.config -> PyQt5
    mslib.utils.config -> mslib.support.qt_json_view.datatypes
    mslib.utils.migration.config_before_eight -> PyQt5
    mslib.utils.migration.config_before_eight -> mslib.support.qt_json_view.datatypes
    mslib.utils.migration.config_before_nine -> PyQt5
    mslib.utils.migration.config_before_nine -> mslib.support.qt_json_view.datatypes
    mslib.utils.migration.update_json_file_to_version_eight -> keyring
    mslib.utils.qt -> PyQt5
    # to do: the client-only helpers move to mslib.msui
    mslib.utils.auth -> keyring

[importlinter:contract:msidp-standalone]
name = mslib.msidp is standalone: no other mslib package, no Qt, numpy or flask
type = forbidden
source_modules =
    mslib.msidp
forbidden_modules =
    mslib.utils
    mslib.msui
    mslib.mswms
    mslib.mscolab
    mslib.plugins
    mslib.support
    mslib.autoplot
    PyQt5
    numpy
    flask

[importlinter:contract:msidp-not-imported]
name = No other mslib package imports mslib.msidp (mss-msidp is a package of its own)
type = forbidden
source_modules =
    mslib.utils
    mslib.msui
    mslib.mswms
    mslib.mscolab
    mslib.plugins
    mslib.support
    mslib.autoplot
forbidden_modules =
    mslib.msidp

[importlinter:contract:servers-without-qt]
name = The servers mswms and mscolab never import Qt
type = forbidden
source_modules =
    mslib.mswms
    mslib.mscolab
forbidden_modules =
    PyQt5

[importlinter:contract:client-without-server-stack]
name = The client (msui, plugins, support, autoplot) never imports the server stack
type = forbidden
source_modules =
    mslib.msui
    mslib.plugins
    mslib.support
    mslib.autoplot
forbidden_modules =
    flask
    flask_cors
    flask_httpauth
    flask_mail
    flask_migrate
    flask_socketio
    flask_sqlalchemy
    flask_wtf
    alembic
    sqlalchemy
    werkzeug
    saml2
ignore_imports =
    # to do (package split, #2307): send_email moves to mslib.mscolab
    mslib.utils.auth -> flask
    mslib.utils.auth -> flask_mail
