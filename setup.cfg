[aliases]
test = pytest

[coverage:run]
branch = True
relative_files = True
source = mslib
omit =
 mslib/msui/qt5/*py
 tests/*

[tool:pytest]
norecursedirs = .git .idea .cache

[flake8]
ignore = E124,E125,E402,W503,W504,A005
max-line-length = 120
exclude = mslib/msui/qt5/*.py, mslib/mscolab/migrations/*.py

# Architectural import contracts (checked by `pixi run -e dev lint-imports` and CI).
# The target dependency direction is documented in ARCHITECTURE.md. Every entry in
# an ignore_imports list below is a grandfathered, known violation of the target
# architecture -- shrink these lists, never grow them.
[importlinter]
root_package = mslib

[importlinter:contract:gui-isolation]
name = Only the GUI package may import mslib.msui
type = forbidden
source_modules =
    mslib.mscolab
    mslib.mswms
    mslib.utils
    mslib.plugins
    mslib.msidp
    mslib.support
forbidden_modules =
    mslib.msui
ignore_imports =
    mslib.plugins.io.csv -> mslib.msui.flighttrack
    mslib.plugins.io.text -> mslib.msui.flighttrack
    mslib.plugins.io.flitestar -> mslib.msui.flighttrack

[importlinter:contract:server-isolation]
name = Only the shared protocol constants of mslib.mscolab may be imported elsewhere
type = forbidden
source_modules =
    mslib.msui
    mslib.mswms
    mslib.utils
    mslib.plugins
    mslib.msidp
    mslib.support
forbidden_modules =
    mslib.mscolab
ignore_imports =
    mslib.msui.socket_control -> mslib.mscolab.events
    mslib.msui.mscolab_chat -> mslib.mscolab.message_type

[importlinter:contract:wms-isolation]
name = No other mslib package may import the mswms server
type = forbidden
source_modules =
    mslib.msui
    mslib.mscolab
    mslib.utils
    mslib.plugins
    mslib.msidp
    mslib.support
forbidden_modules =
    mslib.mswms
